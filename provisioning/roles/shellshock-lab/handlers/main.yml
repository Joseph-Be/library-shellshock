---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart Shellshock lab
  ansible.builtin.systemd:
    name: seed-shellshock.service
    state: restarted
    enabled: true
    daemon_reload: true

- name: Restart display manager
  ansible.builtin.service:
    name: "{{ item }}"
    state: restarted
  loop: >-
    {{ ansible_facts.services.keys()
       | list
       | intersect(['gdm.service', 'gdm3.service', 'lightdm.service']) }}
